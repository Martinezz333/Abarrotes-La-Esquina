
name: Java CI - Abarrotes La Esquina

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: AbarrotesLaEsquina/pom.xml

      - name: Compilar y ejecutar pruebas JUnit
        run: mvn -f AbarrotesLaEsquina/pom.xml test

